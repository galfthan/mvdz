name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Linux only. Other platforms build from source with cargo but are not
# tested here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cd fuzz && cargo fmt --check
      - run: cargo clippy --profile fast --workspace --all-targets -- -D warnings
      - run: cargo clippy --profile fast --features pure-zstd --lib -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # for the Go conformance decoder (tests/interop.rs)
      - uses: actions/setup-go@v5
        with:
          go-version-file: interop/specdec/go.mod
          cache-dependency-path: interop/specdec/go.sum
      # includes the C example (tests/c_api.rs) and the Go decoder over
      # the vectors; tests that need real demos skip without MVDZ_TEST_DATA
      - run: cargo test --profile fast --workspace
      - run: cargo test --profile fast --workspace --features mvdz/pure-zstd

  wasm-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo +1.89 build --locked --workspace --all-targets
