name: Release

on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # zstd-sys compiles libzstd: a musl C compiler
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (baseline x86-64 and x86-64-v3)
        run: |
          cargo build --release --locked --target "$TARGET"
          RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_TARGET_DIR=target-v3 \
            cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        run: |
          for bin in target/$TARGET/release/mvdz target-v3/$TARGET/release/mvdz; do
            "$bin" decompress -f tests/vectors/duel.normal.mvdz demo.mvd
            "$bin" compress -f demo.mvd
            "$bin" decompress -f --trusted demo.mvdz back.mvd
            cmp demo.mvd back.mvd
            sha256sum demo.mvd | grep -q "$(grep '^duel.normal.mvdz' tests/vectors/MANIFEST.tsv | cut -f2)"
            "$bin" info demo.mvdz > /dev/null
            echo "$bin: ok"
          done

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for variant in "" -v3; do
            dir=target; [ -n "$variant" ] && dir=target-v3
            name="mvdz-$version-$TARGET$variant"
            mkdir "$name"
            cp "$dir/$TARGET/release/mvdz" "$dir/$TARGET/release/libmvdz.a" "$name/"
            strip "$name/mvdz"
            strip --strip-debug "$name/libmvdz.a"
            cp include/mvdz.h LICENSE README.md "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Release notes
        run: |
          # the newest CHANGELOG entry, and which download to take
          # (relative links made absolute: the notes are not shown in the tree)
          awk '/^## /{n++} n==1' CHANGELOG.md \
            | sed "s#](\([A-Za-z][^):]*\))#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" > notes.md
          cat >> notes.md <<'NOTES'

          ### Which download?

          | file | for |
          |---|---|
          | `...-x86_64-unknown-linux-musl-v3.tar.gz` | any x86-64 CPU from about 2015 on (AVX2): faster |
          | `...-x86_64-unknown-linux-musl.tar.gz` | any x86-64 CPU (if unsure) |

          Both are static Linux binaries (any distribution). Other platforms:
          build from source with cargo (README).
          NOTES

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "mvdz ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
